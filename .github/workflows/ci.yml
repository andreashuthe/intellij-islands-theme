name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: VS Code for grammar based tests
        run: npm run test:vscode

      - name: Build themes + tests
        run: npm test

      - name: Themes are committed in their generated form
        run: git diff --exit-code -- themes/

      - name: Package .vsix
        run: npx vsce package --out intellij-islands-theme-${{ github.sha }}.vsix

      - name: Upload .vsix
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 14
